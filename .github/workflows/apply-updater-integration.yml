name: Apply Updater Integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-updater-integration.yml"

permissions:
  contents: write

jobs:
  integrate-build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply verified RiftSense integration patch
        shell: pwsh
        run: |
          git apply --check tools/updater_integration.patch
          git apply tools/updater_integration.patch
          New-Item -ItemType Directory -Force ".github/workflows" | Out-Null
          Move-Item -Force "tools/windows-release.yml" ".github/workflows/windows-release.yml"
          Remove-Item "tools/updater_integration.patch"
          Remove-Item ".github/workflows/apply-updater-integration.yml"

      - name: Public source audit
        shell: pwsh
        run: python tools/pre_push_public_audit.py

      - name: Regression tests
        shell: pwsh
        run: python tools/run_tests.py

      - name: Code quality audit
        shell: pwsh
        run: python tools/code_quality_audit.py

      - name: Commit integrated updater
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add single-EXE automatic updater"
          git push origin HEAD:main

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Build one-file RiftSense.exe
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name RiftSense `
            --icon "assets/riftsense.ico" `
            --add-data "assets;assets" `
            --add-data "profiles.json;." `
            --add-data "traits.json;." `
            --add-data "draft_profiles.json;." `
            --add-data "draft_relationships.json;." `
            --add-data "draft_loadouts.json;." `
            --add-data "rune_profiles.json;." `
            --add-data "tier_data.json;." `
            --add-data "ranked_season.json;." `
            RiftSense.py

      - name: Create checksum and first beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versionMatch = Select-String -Path "RiftSense.py" -Pattern '^UPDATE_VERSION = "([^"]+)"$'
          if (-not $versionMatch) { throw "UPDATE_VERSION missing" }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $tag = "v$version"
          $hash = (Get-FileHash "dist/RiftSense.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RiftSense.exe" | Set-Content -Path "dist/RiftSense.exe.sha256" -Encoding ascii
          $target = (git rev-parse HEAD).Trim()
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            $args = @(
              "release", "create", "$tag",
              "dist/RiftSense.exe",
              "dist/RiftSense.exe.sha256",
              "--repo", "$env:GITHUB_REPOSITORY",
              "--target", "$target",
              "--title", "RiftSense $tag",
              "--generate-notes"
            )
            if ($version.Contains("-")) { $args += "--prerelease" }
            & gh @args
          }
